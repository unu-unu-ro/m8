<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8 Săptămâni prin Evanghelia după Marcu</title>
    <meta name="theme-color" content="#fbf9f4" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
          var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang");
          if (l === "en") document.documentElement.lang = "en";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css?v=3.1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Ctext y='28' font-size='28'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="sheet">
      <div id="lang-toggle" class="lang-toggle" role="group" aria-label="Limbă / Language">
        <button type="button" class="lang-toggle__btn" data-lang="ro" lang="ro" aria-pressed="true">RO</button>
        <span class="lang-toggle__sep" aria-hidden="true">·</span>
        <button type="button" class="lang-toggle__btn" data-lang="en" lang="en" aria-pressed="false">EN</button>
      </div>

      <header class="masthead">
        <h1 data-i18n="title">8 Săptămâni prin Evanghelia după Marcu</h1>
        <h2 data-i18n="subtitle">ghid de discuție pentru întâlniri unu-la-unu</h2>
      </header>

      <nav class="timeline" data-i18n-aria="timelineAria" aria-label="Săptămânile planului">
        <ol id="timeline" class="timeline__list" style="--pos: 0">
          <!-- Cele 8 săptămâni sunt generate dinamic aici -->
        </ol>
      </nav>

      <main>
        <section id="content" class="week">
          <div id="week-body" class="week__body">
            <header class="week__head">
              <h2 id="week-title">
                <span id="week-label">Săptămâna 1</span>
                <a id="text-reference" target="_blank" rel="noopener"></a>
              </h2>
            </header>
            <ol id="questions" class="questions">
              <!-- Întrebările vor fi încărcate dinamic aici -->
            </ol>
          </div>
          <nav class="pager" data-i18n-aria="pagerAria" aria-label="Săptămâna anterioară / următoare">
            <button type="button" id="prev" class="pager__btn pager__btn--prev"></button>
            <span id="pager-pos" class="pager__pos"></span>
            <button type="button" id="next" class="pager__btn pager__btn--next"></button>
          </nav>
        </section>
      </main>

      <footer>
        <p>
          <span data-i18n="footerPre">extras din</span>
          <a
            href="https://matthiasmedia.com/products/one-to-one-bible-reading"
            target="_blank"
            rel="noopener"
            >One-to-One Bible Reading</a
          >
          <span data-i18n="footerPost">de David Helm</span>
        </p>
        <div class="mode-toggle">
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider round"></span>
          </label>
          <small data-i18n="darkMode">Mod întunecat</small>
        </div>
      </footer>
    </div>
    <script src="script.js?v=3.1"></script>
    <!-- Cloudflare Web Analytics -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "d9fcc4bb37b5446286b16ef2964b0198"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
